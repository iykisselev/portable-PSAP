outdir: /tmp/portable-psap-mutation-fixture

workflow:
  mode: generate

run:
  generation_prefix: mutation-fixture

model:
  include_indels: false

reference:
  testing_unit_partitions:
    cds: {id: fixture-cds}

generation_settings:
  variant_classes: [snv]
  x_chromosome:
    mutation_rate_policy: sex_averaged_proxy

generation:
  execution:
    allow_unindexed_fixture_inputs: true  # Small, uncompressed test resources only.
  unobserved_policy: mutation_rate
  population_vcf: {data: tests/null_distribution/population_af.vcf, index: null}
  score_snv: {data: tests/null_distribution/mutation_scores.tsv, index: null}
  exclusion: {data: tests/null_distribution/exclusion.bed, index: null}
  testing_unit_partitions:
    - id: cds
      bed: {data: tests/null_distribution/testing_units.bed, index: null}
  par_regions: {data: tests/null_distribution/par_regions.bed, index: null}
  fasta:
    data: tests/smoke/data/reference.fa
    fai: tests/smoke/data/reference.fa.fai
    gzi: null
  mutation_rate: {data: tests/null_distribution/mutation_rates.tsv, index: null}
  af_source:
    overall: AF_CUSTOM
    female: AF_FEMALE
    male: AF_MALE
