# A modestly expanded generation topology for reproducible Stage 1 timing.
# It uses the hand-inspectable null-distribution data but exercises more
# partition and reduction jobs than the default fixture.
outdir: /tmp/portable-psap-partitioned-benchmark

workflow:
  mode: generate

run:
  generation_prefix: benchmark

model:
  include_indels: false

generation_settings:
  variant_classes: [snv]

generation:
  unobserved_policy: zero
  population_vcf: {data: tests/null_distribution/population_af.vcf, index: null}
  score_snv: {data: tests/null_distribution/generation_scores.tsv, index: null}
  exclusion: {data: tests/null_distribution/exclusion.bed, index: null}
  testing_unit_bed: {data: tests/null_distribution/testing_units.bed, index: null}
  par_regions: {data: tests/null_distribution/par_regions.bed, index: null}
  fasta:
    data: tests/smoke/data/reference.fa
    fai: tests/smoke/data/reference.fa.fai
    gzi: null
  af_source:
    overall: AF_CUSTOM
    female: AF_FEMALE
    male: AF_MALE
  execution:
    allow_unindexed_fixture_inputs: true  # Small, uncompressed test resources only.
    partition_size_bp: 10
    unit_bucket_size: 1
