outdir: smoke-output

workflow:
  mode: apply

run:
  apply_prefix: smoke

inputs:
  vcf: {data: tests/smoke/data/cohort.vcf, index: null}
  ped: null
  samples: tests/smoke/data/samples.tsv

bindings:
  reference:
    fasta:
      data: tests/smoke/data/reference.fa
      fai: tests/smoke/data/reference.fa.fai
      gzi: null
    exclusion: {data: null, index: null}
    testing_unit_bed: {data: tests/smoke/data/testing_units.bed, index: null}
    exclusions:
      gnomad-r2-notpass: {data: tests/smoke/data/exclude_full_span.bed, index: null}
      par-regions: {data: tests/smoke/data/par_regions.bed, index: null}
    lookup_source:
      type: external
      contract: external_legacy_v0
      tables:
        het: tests/smoke/data/lookup_het.tsv
        hom: tests/smoke/data/lookup_hom.tsv
        hem_chrX: tests/smoke/data/lookup_hem_chrX.tsv
    cadd:
      snv: {data: tests/smoke/data/cadd_snv.tsv, index: null}
      indel: {data: tests/smoke/data/cadd_indel.tsv, index: null}
