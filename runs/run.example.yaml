# Copy this file to runs/<name>.yaml and replace every path with resources
# available from the invocation directory.  It is deliberately operational:
# it binds one cohort and one set of physical reference files to the immutable
# scientific identities in config/config.yaml.
outdir: results

workflow:
  mode: apply

run:
  apply_prefix: my_analysis

inputs:
  vcf:
    data: data/cohort.vcf.gz
    index: data/cohort.vcf.gz.tbi
  # Choose exactly one metadata source.  `config/samples.tsv` is a template;
  # populate it or point `samples` at a run-specific sample sheet.
  ped: null
  samples: config/samples.tsv

bindings:
  reference:
    fasta:
      data: resources/reference.fa.gz
      fai: resources/reference.fa.gz.fai
      gzi: resources/reference.fa.gz.gzi
    exclusion:
      data: resources/exclusion.bed.gz
      index: resources/exclusion.bed.gz.tbi
    exclusions:
      encode-hg38-blacklist-v2:
        data: resources/variant_exclusions.bed.gz
        index: resources/variant_exclusions.bed.gz.tbi
      par-regions:
        data: resources/par_regions.bed.gz
        index: resources/par_regions.bed.gz.tbi
    lookup_source:
      type: bundle
      directory: results/generate/generate-demo/bundle
    cadd:
      snv:
        data: resources/cadd_snv.tsv.gz
        index: resources/cadd_snv.tsv.gz.tbi
      indel:
        data: resources/cadd_indel.tsv.gz
        index: resources/cadd_indel.tsv.gz.tbi
