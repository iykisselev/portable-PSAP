# Scientific model: testing units are gene identifiers shared with lookup tables.
model:
  unit: gene  # identifier class; joins variants to testing-unit and lookup-table IDs
  hemizygote: true  # boolean; enable X/Y hemizygote classification for known male samples
  score_max: 70  # CADD-PHRED points; maximum represented by the lookup scoring grid
  include_indels: true  # boolean; annotate indels with CADD without removing them from the VCF

reference:
  assembly: GRCh38  # genome build; required for every cohort and annotation resource
  # Immutable resource identities; physical locations belong in a user run manifest.
  fasta:
    id: GRCh38.p14  # reference sequence release identifier
  coverage:
    id: gnomad-genomes-r3-dp10  # callable-region resource identifier
    optional: true  # boolean; allow this coverage filter to be absent
    kind: bed  # file layout; BED intervals
  testing_unit_bed:
    id: biomart-grch38-107-gene  # testing-unit annotation release identifier
  # Source order is scientific: exclusions are projected and combined in this order.
  exclusions:
    - id: gnomad-r2-notpass  # source identifier; remove excluded variant intervals
      kind: bed  # file layout; BED intervals
      role: variants_exclude  # scientific role; variant exclusion set
    - id: par-regions  # source identifier; pseudoautosomal-region intervals
      kind: bed  # file layout; BED intervals
      role: par_regions  # scientific role; PAR exclusion set
  lookup_tables:
    # Lookup roles map genotype classes to model-specific frequency/CADD grids.
    het:
      id: gnomad-v3-cadd-1.6-gene-het  # heterozygous lookup-table release identifier
    hom:
      id: gnomad-v3-cadd-1.6-gene-hom  # homozygous lookup-table release identifier
    hem_chrX:
      id: gnomad-v3-cadd-1.6-gene-hem-chrX  # hemizygous chromosome-X lookup release identifier
  cadd:
    # Explicit CADD resources replace the implicit cadd_dir filename convention.
    snv:
      id: CADD-v1.6-SNV  # single-nucleotide CADD resource release identifier
    indel:
      id: CADD-v1.6-InDels  # indel CADD resource release identifier

report:
  deduplicate_controls: true  # boolean; remove only exact duplicate control-evidence rows
  candidate_id:
    separator: ":"  # text delimiter; separates patient, disease-model tag, and ordinal
    ordinal_width: 3  # decimal digits; zero-padded width of the per-model candidate ordinal

# Provisional generator scope. Absence-policy and mutation conversion decisions
# remain in the null-distribution contract and are not selected here.
generation_settings:
  coverage_minimum: 0.5  # fraction of unioned testing-unit bases in the callable resource
  variant_classes: [snv]  # initial preparation scope; indel generation is rejected
  score_bin_width: 0.05  # generated-grid width; score_max is included in the final bin
  mutation_conversion: de_novo_proxy  # D2-selected proxy; p_effective = per-allele mu
