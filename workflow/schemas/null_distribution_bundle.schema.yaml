$schema: "https://json-schema.org/draft/2020-12/schema"
title: Portable PSAP partitioned null-distribution bundle
type: object
additionalProperties: false
required: [schema_version, contract, assembly, contig_convention, testing_unit_type, binning, model_assumptions, partitions, overlap_policy, indel_assignment_policy, counts, resource_identities, components, validation_artifacts]
properties:
  schema_version: {const: 1}
  contract: {const: partitioned_null_bundle_v1}
  assembly: {enum: [GRCh37, GRCh38]}
  contig_convention: {const: canonical_without_chr_prefix}
  testing_unit_type: {enum: [gene, cadd_region, coding_cadd_region]}
  af_info_tags: {type: object, required: [overall]}
  binning:
    type: object
    additionalProperties: false
    required: [algorithm, score_max, bin_width, bin_count, maximum_in_final_bin]
    properties:
      algorithm: {const: fixed_width_decimal_v1}
      score_max: {type: number, exclusiveMinimum: 0}
      bin_width: {type: number, exclusiveMinimum: 0}
      bin_count: {type: integer, minimum: 1}
      maximum_in_final_bin: {const: true}
  model_assumptions: {type: object}
  partitions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, order, source_identity, resolved_component, eligible_component, lookups, pair_counts]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}
        order: {type: integer, minimum: 0}
        source_identity: {type: string, minLength: 1}
        resolved_component: {type: string, pattern: "^resolved\\."}
        eligible_component: {type: string, pattern: "^eligible\\."}
        lookups: {type: object, minProperties: 4}
        pair_counts:
          type: object
          additionalProperties: false
          required: [declared, eligible]
          properties:
            declared: {type: integer, minimum: 0}
            eligible: {type: integer, minimum: 0}
  overlap_policy: {const: earlier_partition_owns_overlapping_bases_v1}
  indel_assignment_policy: {const: first_overlapping_resolved_partition_v1}
  counts:
    type: object
    additionalProperties: false
    required: [eligible_pairs, declared_pairs, excluded_alleles, calibration_intervals, population_af_zero_imputations]
    properties:
      eligible_pairs: {type: integer, minimum: 0}
      declared_pairs: {type: integer, minimum: 0}
      excluded_alleles: {type: integer, minimum: 0}
      calibration_intervals: {type: integer, minimum: 0}
      population_af_zero_imputations: {type: integer, minimum: 0}
  resource_identities: {type: object}
  components:
    type: object
    minProperties: 1
    additionalProperties: {$ref: "#/$defs/component"}
  validation_artifacts:
    type: object
    additionalProperties: false
    required: [report, marker]
    properties:
      report: {const: validation.json}
      marker: {const: validation.ok}
$defs:
  component:
    type: object
    additionalProperties: false
    required: [path, sha256, bytes]
    properties:
      path: {type: string, minLength: 1, pattern: "^[^/]+$"}
      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      bytes: {type: integer, minimum: 1}
