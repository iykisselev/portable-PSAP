$schema: "https://json-schema.org/draft/2020-12/schema"
title: Portable PSAP scientific configuration
description: >-
  Biology and analysis decisions only. Physical file locations, output roots,
  scheduler settings, and site-specific settings belong elsewhere.
type: object
required: [model, reference, report, generation_settings]
properties:
  model:
    type: object
    additionalProperties: false
    required: [unit, hemizygote, score_max, include_indels]
    properties:
      unit: {enum: [gene, cadd_region, coding_cadd_region]}
      hemizygote: {type: boolean}
      score_max: {type: number, exclusiveMinimum: 0}
      include_indels: {type: boolean}
  reference:
    type: object
    additionalProperties: false
    required: [assembly, fasta, exclusion, testing_unit_bed, exclusions, cadd]
    properties:
      assembly: {enum: [GRCh37, GRCh38]}
      fasta: {$ref: "#/$defs/resource_identity"}
      exclusion:
        type: object
        additionalProperties: false
        required: [id, kind]
        properties:
          id: {type: string, minLength: 1}
          kind: {enum: [bed, tsv]}
      testing_unit_bed: {$ref: "#/$defs/resource_identity"}
      exclusions:
        type: object
        propertyNames: {$ref: "#/$defs/resource_id"}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [kind, role]
          properties:
            kind: {enum: [bed, tsv, vcf]}
            role: {enum: [variants_exclude, par_regions]}
            enabled: {type: boolean, default: true}
      cadd:
        type: object
        additionalProperties: false
        required: [snv, indel]
        properties:
          snv: {$ref: "#/$defs/resource_identity"}
          indel: {$ref: "#/$defs/resource_identity"}
  report:
    type: object
    additionalProperties: false
    required: [deduplicate_controls, candidate_id]
    properties:
      deduplicate_controls: {type: boolean}
      candidate_id:
        type: object
        additionalProperties: false
        required: [separator, ordinal_width]
        properties:
          separator: {type: string, minLength: 1}
          ordinal_width: {type: integer, minimum: 1}
  generation_settings:
    type: object
    additionalProperties: false
    required: [minimum_retained_fraction, variant_classes, score_bin_width, mutation_conversion, x_chromosome]
    properties:
      minimum_retained_fraction: {type: number, minimum: 0, maximum: 1}
      variant_classes:
        type: array
        const: [snv]
      score_bin_width: {type: number, exclusiveMinimum: 0}
      mutation_conversion: {const: de_novo_proxy}
      x_chromosome:
        type: object
        additionalProperties: false
        required: [af_policy, mutation_rate_policy]
        properties:
          af_policy: {enum: [sex_specific, overall_proxy]}
          mutation_rate_policy: {enum: [reject, sex_averaged_proxy]}
$defs:
  resource_id:
    type: string
    minLength: 1
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  resource_identity:
    type: object
    required: [id]
    properties:
      id: {type: string, minLength: 1}
