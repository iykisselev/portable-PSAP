$schema: "https://json-schema.org/draft/2020-12/schema"
title: Portable PSAP run configuration
type: object
required: [outdir, workflow, run]
properties:
  outdir: {type: string, minLength: 1}
  workflow:
    type: object
    required: [mode]
    properties:
      mode: {enum: [generate, apply, full]}
    additionalProperties: false
  run:
    type: object
    properties:
      apply_prefix: {type: string, minLength: 1, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}
      generation_prefix: {type: string, minLength: 1, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}
    additionalProperties: false
  inputs:
    type: object
    additionalProperties: false
    required: [vcf, ped, samples]
    properties:
      vcf: {$ref: "#/$defs/indexed_genomic_binding"}
      ped: {type: [string, "null"], minLength: 1}
      samples: {type: [string, "null"], minLength: 1}
    oneOf:
      - properties: {ped: {type: string}, samples: {type: "null"}}
      - properties: {ped: {type: "null"}, samples: {type: string}}
  bindings:
    type: object
    additionalProperties: false
    required: [reference]
    properties:
      reference: {type: object}
  generation: {type: object}
  model:
    type: object
    properties:
      hemizygote: {type: boolean}
      include_indels: {type: boolean}
    additionalProperties: true
$defs:
  resource_id:
    type: string
    minLength: 1
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  indexed_genomic_binding:
    type: object
    additionalProperties: false
    required: [data, index]
    properties:
      data: {type: string, minLength: 1}
      index: {type: [string, "null"], minLength: 1}
  optional_indexed_genomic_binding:
    type: object
    additionalProperties: false
    required: [data, index]
    properties:
      data: {type: [string, "null"], minLength: 1}
      index: {type: [string, "null"], minLength: 1}
  fasta_binding:
    type: object
    additionalProperties: false
    required: [data, fai, gzi]
    properties:
      data: {type: string, minLength: 1}
      fai: {type: string, minLength: 1}
      gzi: {type: [string, "null"], minLength: 1}
  exclusion_bindings:
    type: object
    propertyNames: {$ref: "#/$defs/resource_id"}
    additionalProperties: {$ref: "#/$defs/indexed_genomic_binding"}
  cadd_bindings:
    type: object
    additionalProperties: false
    required: [snv]
    properties:
      snv: {$ref: "#/$defs/indexed_genomic_binding"}
      indel: {$ref: "#/$defs/optional_indexed_genomic_binding"}
  reference_binding_base:
    type: object
    additionalProperties: false
    required: [fasta, exclusion, testing_unit_bed, exclusions, cadd]
    properties:
      fasta: {$ref: "#/$defs/fasta_binding"}
      exclusion: {$ref: "#/$defs/optional_indexed_genomic_binding"}
      testing_unit_bed: {$ref: "#/$defs/indexed_genomic_binding"}
      exclusions: {$ref: "#/$defs/exclusion_bindings"}
      cadd: {$ref: "#/$defs/cadd_bindings"}
      lookup_source: {$ref: "#/$defs/lookup_source"}
  apply_reference_binding:
    allOf:
      - {$ref: "#/$defs/reference_binding_base"}
      - type: object
        required: [lookup_source]
        properties:
          lookup_source: {$ref: "#/$defs/lookup_source"}
  full_reference_binding:
    allOf:
      - {$ref: "#/$defs/reference_binding_base"}
      - type: object
        properties:
          lookup_source: false
  af_source:
    type: object
    additionalProperties: false
    required: [overall]
    properties:
      overall: {type: string, minLength: 1}
      female: {type: [string, "null"]}
      male: {type: [string, "null"]}
  generation_execution:
    type: object
    additionalProperties: false
    properties:
      partition_size_bp: {type: integer, minimum: 1}
      allow_unindexed_fixture_inputs: {type: boolean, default: false}
      unit_bucket_size: {type: integer, minimum: 1}
      parquet_compression: {enum: [zstd, lz4, snappy, gzip, uncompressed]}
  generation_binding_base:
    type: object
    additionalProperties: false
    required: [population_vcf, af_source, unobserved_policy]
    properties:
      population_vcf: {$ref: "#/$defs/indexed_genomic_binding"}
      mutation_rate: {$ref: "#/$defs/indexed_genomic_binding"}
      mutation_rate_indel: {$ref: "#/$defs/indexed_genomic_binding"}
      unobserved_policy: {enum: [zero, mutation_rate]}
      af_source: {$ref: "#/$defs/af_source"}
      execution: {$ref: "#/$defs/generation_execution"}
      score_snv: {$ref: "#/$defs/indexed_genomic_binding"}
      score_indel: {$ref: "#/$defs/indexed_genomic_binding"}
      exclusion: {$ref: "#/$defs/optional_indexed_genomic_binding"}
      testing_unit_bed: {$ref: "#/$defs/indexed_genomic_binding"}
      par_regions: {$ref: "#/$defs/indexed_genomic_binding"}
      exclusions:
        type: array
        items: {$ref: "#/$defs/indexed_genomic_binding"}
      fasta: {$ref: "#/$defs/fasta_binding"}
  standalone_generation_binding:
    allOf:
      - {$ref: "#/$defs/generation_binding_base"}
      - type: object
        required: [score_snv, exclusion, testing_unit_bed, par_regions, fasta]
  full_generation_binding:
    allOf:
      - {$ref: "#/$defs/generation_binding_base"}
      - type: object
        properties:
          score_snv: false
          score_indel: false
          exclusion: false
          testing_unit_bed: false
          par_regions: false
          exclusions: false
          fasta: false
  lookup_source:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, contract, tables]
        properties:
          type: {const: external}
          contract: {const: external_legacy_v0}
          tables: {$ref: "#/$defs/lookup_table_paths"}
      - type: object
        additionalProperties: false
        required:
          - type
          - contract
          - tables
          - metadata
          - validation
          - marker
          - eligible_units
          - calibration_mask
          - excluded_alleles
          - excluded_units
        properties:
          type: {const: bundle}
          contract: {enum: [generated_bundle_v1, generated_bundle_v2, generated_bundle_v3]}
          tables: {$ref: "#/$defs/lookup_table_paths"}
          metadata: {type: string, minLength: 1}
          validation: {type: string, minLength: 1}
          marker: {type: string, minLength: 1}
          eligible_units: {type: string, minLength: 1}
          calibration_mask: {type: string, minLength: 1}
          excluded_alleles: {type: string, minLength: 1}
          excluded_units: {type: string, minLength: 1}
  lookup_table_paths:
    type: object
    additionalProperties: false
    required: [het, hom]
    properties:
      het: {type: string, minLength: 1}
      hom: {type: string, minLength: 1}
      hem_chrX: {type: string, minLength: 1}
  apply_mode:
    type: object
    required: [inputs, bindings]
    properties:
      workflow: {properties: {mode: {const: apply}}, required: [mode]}
      generation: false
      run: {required: [apply_prefix]}
      bindings:
        properties:
          reference: {$ref: "#/$defs/apply_reference_binding"}
    allOf:
      - if:
          properties: {model: {properties: {hemizygote: {const: true}}, required: [hemizygote]}}
          required: [model]
        then:
          properties:
            bindings:
              properties:
                reference:
                  properties:
                    lookup_source:
                      properties:
                        tables: {required: [hem_chrX]}
      - if:
          properties: {model: {properties: {include_indels: {const: true}}, required: [include_indels]}}
          required: [model]
        then:
          properties:
            bindings:
              properties:
                reference:
                  properties:
                    cadd: {required: [indel]}
  generate_policy:
    type: object
    allOf:
      - if:
          properties:
            generation_settings:
              properties:
                x_chromosome:
                  properties: {af_policy: {const: sex_specific}}
                  required: [af_policy]
              required: [x_chromosome]
          required: [generation_settings]
        then:
          properties:
            generation:
              properties:
                af_source:
                  required: [female]
                  properties:
                    female: {type: string, minLength: 1}
      - if:
          properties:
            generation_settings:
              properties:
                x_chromosome:
                  properties: {af_policy: {const: sex_specific}}
                  required: [af_policy]
              required: [x_chromosome]
            model: {properties: {hemizygote: {const: true}}, required: [hemizygote]}
          required: [generation_settings, model]
        then:
          properties:
            generation:
              properties:
                af_source:
                  required: [male]
                  properties:
                    male: {type: string, minLength: 1}
      - if:
          properties:
            generation:
              properties: {unobserved_policy: {const: mutation_rate}}
              required: [unobserved_policy]
          required: [generation]
        then:
          properties:
            generation:
              required: [mutation_rate]
  generate_mode:
    allOf:
      - {$ref: "#/$defs/generate_policy"}
      - if:
          properties: {model: {properties: {include_indels: {const: true}}, required: [include_indels]}}
          required: [model]
        then:
          properties:
            generation: {required: [score_indel]}
    type: object
    required: [generation]
    properties:
      workflow: {properties: {mode: {const: generate}}, required: [mode]}
      inputs: false
      bindings: false
      run: {required: [generation_prefix]}
      generation: {$ref: "#/$defs/standalone_generation_binding"}
  full_mode:
    allOf:
      - {$ref: "#/$defs/generate_policy"}
      - if:
          properties: {model: {properties: {include_indels: {const: true}}, required: [include_indels]}}
          required: [model]
        then:
          properties:
            bindings:
              properties:
                reference:
                  properties:
                    cadd: {required: [indel]}
    type: object
    required: [inputs, bindings, generation]
    properties:
      workflow: {properties: {mode: {const: full}}, required: [mode]}
      run: {required: [apply_prefix, generation_prefix]}
      bindings:
        properties:
          reference: {$ref: "#/$defs/full_reference_binding"}
      generation: {$ref: "#/$defs/full_generation_binding"}
oneOf:
  - {$ref: "#/$defs/apply_mode"}
  - {$ref: "#/$defs/generate_mode"}
  - {$ref: "#/$defs/full_mode"}
